<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SASA MINI APP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b14;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:25px 15px;color:#38a9ff}
h1{font-size:30px;margin:5px}
.subtitle{color:#aaa}
.container{padding:18px;max-width:500px;margin:auto}
.card{background:#151c2c;border:1px solid #263954;border-radius:18px;padding:20px;margin-bottom:16px}
.balance{text-align:center}
.balance strong{font-size:35px;color:#40b5ff;display:block;margin:12px}
button{border:0;border-radius:12px;padding:13px;background:#168cff;color:white;font-size:16px;width:100%;margin-top:10px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
nav button{background:#202b40;font-size:13px}
section{display:none}
section.active{display:block}
.muted{color:#aab4c5;font-size:14px}
</style>
</head>
<body>
<header>
<h1>SASA MINI APP</h1>
<div class="subtitle">منصتك الذكية للنقاط والمكافآت</div>
</header>
<div class="container">
<div class="card balance">
<div>رصيدك الافتراضي</div>
<strong id="balance">0</strong>
<div class="muted">نقطة تجريبية</div>
<button onclick="mine()">ابدأ التجميع</button>
<p id="status" class="muted">جاهز للتجميع</p>
</div>
<nav>
<button onclick="show('tasks')">المهام</button>
<button onclick="show('shop')">المتجر</button>
<button onclick="show('account')">حسابي</button>
</nav>
<section id="tasks" class="active card">
<h3>المهام والمكافآت</h3>
<p>اجمع نقاطًا افتراضية من خلال المهام التجريبية.</p>
<button onclick="reward()">استلام مكافأة تجريبية</button>
</section>
<section id="shop" class="card">
<h3>متجر المكافآت</h3>
<p>المتجر تجريبي، والنقاط ليست أموالًا حقيقية.</p>
<p>شارة العضوية — 100 نقطة</p>
</section>
<section id="account" class="card">
<h3>حسابي</h3>
<p id="user">مرحبًا بك في SASA MINI APP</p>
<p class="muted">نسخة تجريبية</p>
</section>
</div>
<script>
let balance=Number(localStorage.getItem('sasaBalance')||0);
function update(){
document.getElementById('balance').textContent=balance;
localStorage.setItem('sasaBalance',balance);
}
function mine(){
balance+=1;
update();
document.getElementById('status').textContent='تمت إضافة نقطة تجريبية!';
}
function reward(){
balance+=5;
update();
alert('مبروك! حصلت على 5 نقاط تجريبية');
}
function show(id){
document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}
update();
</script>
</body>
</html>
